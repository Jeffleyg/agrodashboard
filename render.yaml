services:
  - type: web
    name: weatherpro-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: weatherpro-db
          property: connectionString

  - type: static_site
    name: weatherpro-frontend
    buildCommand: npm run build
    publish: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://weatherpro-backend.onrender.com